name: E2E Tests
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: 'Version to test (e.g. v1.6.0-beta.1)'
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true
  workflow_dispatch:

jobs:
  build-images:
    permissions:
      contents: write
      packages: write
    if: ${{ !inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        uses: ./.github/actions/build-image
        with:
          version: e2e
          sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          platforms: linux/amd64
          tags: ghcr.io/runtipi/runtipi:e2e

      - name: Create cli folder
        run: mkdir -p bin

      - name: Download CLI form release on runtipi/cli repo
        run: |
          REPO="runtipi/cli"
          VERSION=nightly

          ASSETS_URL=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$VERSION" \
            | jq -r '.assets[] | select(.name | test("runtipi-cli.+")) | .browser_download_url')

          echo "Assets URL: $ASSETS_URL"

          for url in $ASSETS_URL; do
            echo "Downloading from $url"
            curl -L -o "bin/${url##*/}" -H "Accept: application/octet-stream" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$url"
          done

      - name: Print files
        run: tree bin

      - uses: pyTooling/Actions/releaser@b346408fef88bd4cfda9109149e9ec8338a32b15 # r0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: e2e
          rm: true
          files: bin/runtipi-cli-*

  e2e:
    permissions:
      contents: read
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: [build-images]
    if: ${{ always() && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create .env.local
        run: |
          echo "LOG_LEVEL=debug" > .env.local

      - name: Run install script
        if: ${{ inputs.version }}
        run: |
          docker version
          mkdir -p runtipi/user-config
          echo -e "services:\n  runtipi-db:\n    ports:\n      - 5432:5432" > runtipi/user-config/tipi-compose.yml
          curl -s https://raw.githubusercontent.com/runtipi/runtipi/${{ inputs.version }}/scripts/install.sh > install.sh
          chmod +x install.sh
          ./install.sh --version ${{ inputs.version }} --asset runtipi-cli-linux-x86_64.tar.gz --env-file ${{ github.workspace }}/.env.local

      - name: Run install script
        if: ${{ !inputs.version }}
        run: |
          mkdir -p runtipi/user-config
          echo -e "services:\n  runtipi-db:\n    ports:\n      - 5432:5432" > runtipi/user-config/tipi-compose.yml
          ./scripts/install.sh --version e2e --env-file ${{ github.workspace }}/.env.local
          cd ..

      - name: Create .env.e2e file
        run: |
          postgres_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' runtipi-db)

          if [ -z "$postgres_ip" ]; then
            echo "Unable to determine the runtipi-db container IP"
            docker inspect --format '{{json .NetworkSettings.Networks}}' runtipi-db
            exit 1
          fi

          timeout 30 bash -c "until </dev/tcp/$postgres_ip/5432; do sleep 1; done"

          echo "SERVER_IP=127.0.0.1" > .env.e2e
          echo "E2E_POSTGRES_HOST=$postgres_ip" >> .env.e2e
          echo "POSTGRES_PASSWORD=$(grep POSTGRES_PASSWORD runtipi/.env | cut -d '=' -f2)" >> .env.e2e
          echo "BASE_PATH=./runtipi" >> .env.e2e
          echo "HOME=/root" >> .env.e2e

      - name: Install dependencies
        uses: './.github/actions/install-dependencies'

      - name: Get installed playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")" >> $GITHUB_OUTPUT

      - name: Cache Playwright binaries
        id: cache-playwright-binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /root/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright-binaries.outputs.cache-hit != 'true'
        run: sudo env "PATH=$PATH" bunx playwright install --with-deps

      - name: Install dependencies
        uses: './.github/actions/install-dependencies'

      - name: Run Playwright tests
        id: run-e2e
        run: sudo env "PATH=$PATH" bun run test:e2e

      - name: Dump app logs in playwright-report folder
        if: always()
        run: |
          id
          sudo mkdir -p playwright-report
          sudo cp ./runtipi/logs/* playwright-report/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  report-deployment:
    runs-on: ubuntu-latest
    needs: [e2e]
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: always()
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: playwright-report
          path: playwright-report/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: playwright-report/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
