name: Tipi CI
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        uses: './.github/actions/install-dependencies'

      - name: Check formatting and lint
        run: bun run lint:ci
        env:
          # PR checkouts are merge commits; compare against the base actually tested.
          FORMAT_BASE: HEAD^1

      - name: Run tests
        run: bun run test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: './.github/actions/install-dependencies'

      - name: Build client
        run: bun run bundle

      - name: Typecheck with Bun
        run: bun run typecheck
