services:
  migration:
    image: postgres:16.1
    user: postgres
    network_mode: none
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    environment:
      CALCOM_POSTGRES_PASSWORD: ${CALCOM_POSTGRES_PASSWORD}
    entrypoint:
      - /bin/bash
      - -euc
    command:
      - |
        : "$${CALCOM_POSTGRES_PASSWORD:?Missing Cal.com database password}"
        test -s "$$PGDATA/PG_VERSION"

        umask 077
        mkdir /tmp/calcom-migration
        printf 'local all all trust\n' > /tmp/calcom-migration/pg_hba.conf

        chmod 0700 "$$PGDATA"
        pg_ctl -D "$$PGDATA" -w start \
          -o "-c listen_addresses='' -c unix_socket_directories=/tmp/calcom-migration -c hba_file=/tmp/calcom-migration/pg_hba.conf -c log_statement=none -c log_min_error_statement=panic"
        trap 'pg_ctl -D "$$PGDATA" -m fast -w stop' EXIT

        psql -X -w -v ON_ERROR_STOP=1 \
          -h /tmp/calcom-migration -U tipi -d calcom <<'SQL'
        \getenv password CALCOM_POSTGRES_PASSWORD
        ALTER ROLE CURRENT_USER PASSWORD :'password';
        SQL
